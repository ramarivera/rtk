name: Update Next Release PR

# SECURITY — why `pull_request_target` is used here, and what keeps it safe.
#
# `pull_request_target` runs with repository secrets and a writable token, which
# is what makes the classic "pwn request" possible. That attack needs the
# workflow to *check out and execute* code from the untrusted PR head. This
# workflow does none of that, and the invariants below MUST hold — breaking any
# one of them reintroduces the hole:
#
#   1. NO `actions/checkout`, ever. This workflow has zero `uses:` steps and
#      never fetches PR head content. If you need the PR's code, put it in a
#      separate `pull_request` workflow instead.
#   2. NO build, test or script from the repo tree is executed — only `gh`,
#      `jq` and coreutils from the runner image.
#   3. Attacker-controlled fields (PR title/body) reach the script ONLY through
#      `env:`, never interpolated into `run:` via `${{ }}`, and every use is
#      double-quoted. `awk` reads the entry through ENVIRON rather than `-v`.
#      This is the documented anti-injection pattern.
#   4. `permissions:` stays minimal: `contents: read` plus the
#      `pull-requests: write` this job actually needs. Never `contents: write`.
#
# The trigger also requires `merged == true` on a PR into `develop`, and merging
# requires write access, so an outside contributor cannot reach it at all.
#
# `pull_request` is not a workable substitute: fork PRs get a read-only token
# under that trigger, so `gh pr edit` would fail and the release note would be
# dropped silently. The repository guard below is the fork-side mitigation.

on:
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-next-release:
    # Upstream-only: forks do not run the Next Release process, so this never
    # executes with a fork's secrets.
    if: >-
      github.repository == 'rtk-ai/rtk' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Update Next Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          ALLOWED_REPOS: "rtk-ai/rtk"
        run: |
          set -euo pipefail

          URL_PATTERN=""
          for repo in $ALLOWED_REPOS; do
            URL_PATTERN="${URL_PATTERN}|https://github\\.com/${repo}/issues/[0-9]+"
          done
          URL_PATTERN="${URL_PATTERN#|}"

          if printf '%s' "$PR_TITLE" | grep -qiE '^feat'; then
            SECTION="Feats"
          elif printf '%s' "$PR_TITLE" | grep -qiE '^fix'; then
            SECTION="Fix"
          else
            SECTION="Other"
          fi

          ISSUE_REFS=""
          if [ -n "$PR_BODY" ]; then
            ISSUE_REFS=$(echo "$PR_BODY" \
              | grep -oiE "(closes|fixes|resolves):?\s+#[0-9]+|${URL_PATTERN}" \
              | grep -oE '#[0-9]+|issues/[0-9]+' \
              | sed 's|issues/|#|' \
              | sort -u \
              || true)
          fi

          ENTRY="- ${PR_TITLE} [#${PR_NUMBER}](${PR_URL})"
          if [ -n "$ISSUE_REFS" ]; then
            CLOSES_PARTS=""
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              NUM="${ref#\#}"
              ISSUE_URL="https://github.com/${REPO}/issues/${NUM}"
              if [ -n "$CLOSES_PARTS" ]; then
                CLOSES_PARTS="${CLOSES_PARTS}, [${ref}](${ISSUE_URL}) (to verify)"
              else
                CLOSES_PARTS="Closes [${ref}](${ISSUE_URL}) (to verify)"
              fi
            done <<< "$ISSUE_REFS"
            ENTRY="${ENTRY} — ${CLOSES_PARTS}"
          fi

          NEXT_PR=$(gh pr list \
            --repo "$REPO" \
            --label next-release \
            --base master \
            --head develop \
            --state open \
            --json number,body \
            --jq '.[0] // empty')

          NEXT_PR_NUMBER=""
          if [ -n "$NEXT_PR" ]; then
            NEXT_PR_NUMBER=$(echo "$NEXT_PR" | jq -r '.number')
          fi

          if [ -z "$NEXT_PR_NUMBER" ]; then
            TEMPLATE="### Feats

          ### Fix

          ### Other"

            PR_CREATE_URL=$(gh pr create \
              --repo "$REPO" \
              --base master \
              --head develop \
              --title "Next Release" \
              --label next-release \
              --body "$TEMPLATE")

            NEXT_PR_NUMBER=$(echo "$PR_CREATE_URL" | grep -oE '/pull/[0-9]+' | grep -oE '[0-9]+')
            CURRENT_BODY="$TEMPLATE"
          else
            CURRENT_BODY=$(echo "$NEXT_PR" | jq -r '.body')
          fi

          SECTION_HEADER="### ${SECTION}"
          export ENTRY
          if echo "$CURRENT_BODY" | grep -qF "$SECTION_HEADER"; then
            UPDATED_BODY=$(echo "$CURRENT_BODY" | awk -v section="$SECTION_HEADER" '
              $0 == section {
                print
                print ENVIRON["ENTRY"]
                next
              }
              { print }
            ')
          else
            UPDATED_BODY="${CURRENT_BODY}

          ${SECTION_HEADER}
          ${ENTRY}"
          fi

          gh pr edit "$NEXT_PR_NUMBER" \
            --repo "$REPO" \
            --body "$UPDATED_BODY"

          echo "Updated Next Release PR #${NEXT_PR_NUMBER} — added entry to ### ${SECTION}"
